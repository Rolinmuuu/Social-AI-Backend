services:
  # ── API Gateway ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - post
      - social
      - message

  # ── Microservices ─────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
      - LOGSTASH_ADDRESS=logstash:5000
    depends_on:
      migrate:
        condition: service_completed_successfully
      logstash:
        condition: service_started

  post:
    build:
      context: .
      dockerfile: services/post/Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
      - ES_URL=http://elasticsearch:9200
      - ES_PASSWORD=${ES_PASSWORD}
      - LOGSTASH_ADDRESS=logstash:5000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - KAFKA_BROKERS=kafka:9092
      # Media goes to the local GCS emulator. To use a real bucket, set STORAGE_EMULATOR_HOST=
      # (empty), GCS_BUCKET, GCS_PUBLIC_BASE_URL= and give the container credentials.
      - STORAGE_EMULATOR_HOST=${STORAGE_EMULATOR_HOST-http://gcs:4443}
      - GCS_BUCKET=${GCS_BUCKET:-socialai-media}
      - GCS_PUBLIC_BASE_URL=${GCS_PUBLIC_BASE_URL-http://localhost:4443}
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
      redis:
        condition: service_started
      gcs:
        condition: service_started
      logstash:
        condition: service_started
      kafka:
        condition: service_started

  social:
    build:
      context: .
      dockerfile: services/social/Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
      - LOGSTASH_ADDRESS=logstash:5000
    depends_on:
      migrate:
        condition: service_completed_successfully
      logstash:
        condition: service_started

  message:
    build:
      context: .
      dockerfile: services/message/Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
      - LOGSTASH_ADDRESS=logstash:5000
    depends_on:
      migrate:
        condition: service_completed_successfully
      logstash:
        condition: service_started

  # ── Infrastructure ────────────────────────────────────────────────────────
  # System of record: users, follows, posts, likes, comments, messages, outbox.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=socialai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-socialai}
      - POSTGRES_DB=socialai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialai -d socialai"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies migrations/ and exits. Services start only after it succeeded, so a
  # failed migration stops the rollout instead of crash-looping every service.
  migrate:
    build:
      context: .
      dockerfile: cmd/Dockerfile
    command: ["./migrate"]
    environment:
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Search projection of posts only (built by search-indexer from PostgreSQL).
  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Local stand-in for Google Cloud Storage (media uploads), so the stack runs without a GCP
  # account. Objects are served at http://localhost:4443/<bucket>/<object>.
  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory",
              "-public-host", "localhost", "-external-url", "http://gcs:4443"]
    ports:
      - "4443:4443"

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - auth
      - post
      - social
      - message

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # ── Log Pipeline (ELK) ────────────────────────────────────────────────────
  elasticsearch-logs:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"

  logstash:
    image: logstash:8.13.0
    ports:
      - "5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch-logs

  kibana:
    image: kibana:8.13.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-logs:9200
    depends_on:
      - elasticsearch-logs

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      # Auto-created topics get 6 partitions (the image default is 1), so running more than one
      # feed-worker (docker compose up --scale feed-worker=3) actually splits the work.
      - KAFKA_NUM_PARTITIONS=6

  feed-worker:
    build:
      context: .
      dockerfile: services/feed/Dockerfile
    # Scale horizontally: `docker compose up --scale feed-worker=3`. Kafka's consumer group
    # splits partitions between instances; inside each, events run on 8 keyed workers.
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      redis:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
      - LOGSTASH_ADDRESS=logstash:5000

  notification-worker:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
      - LOGSTASH_ADDRESS=logstash:5000

  # Keeps the Elasticsearch post index in step with PostgreSQL (post.created/post.deleted).
  search-indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgres://socialai:${POSTGRES_PASSWORD:-socialai}@postgres:5432/socialai?sslmode=disable
      - ES_URL=http://elasticsearch:9200
      - ES_PASSWORD=${ES_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGSTASH_ADDRESS=logstash:5000

volumes:
  pg_data:
  es_data:
