global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth:8081']

  - job_name: 'post-service'
    static_configs:
      - targets: ['post:8082']

  - job_name: 'social-service'
    static_configs:
      - targets: ['social:8083']

  - job_name: 'message-service'
    static_configs:
      - targets: ['message:8084']

  - job_name: 'feed-worker'
    static_configs:
      - targets: ['feed-worker:9101']

  - job_name: 'notification-worker'
    static_configs:
      - targets: ['notification-worker:9102']

  - job_name: 'search-indexer'
    static_configs:
      - targets: ['search-indexer:9103']
