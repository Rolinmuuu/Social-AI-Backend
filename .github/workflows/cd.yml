name: CD

# Manual deploy. It used to run on every push with `if: secrets.GCP_SA_KEY != ''` at job
# level, which GitHub rejects (secrets are not available in job-level `if`), so every push
# showed a failed CD run. Run it from the Actions tab once GCP secrets are configured.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_GCP_KEY: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Check configuration
        if: env.HAS_GCP_KEY != 'true'
        run: |
          echo "GCP_SA_KEY is not set; nothing to deploy."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to App Engine
        run: gcloud app deploy app.yml --quiet
